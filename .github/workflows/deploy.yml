name: Deploy

# Publishes a release tag (vX.Y.Z) on the VPS. To roll back or redeploy, use
# "Run workflow" and pick the tag under "Use workflow from".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one halfway (the app would stay in maintenance).
concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish on the VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets live in this environment, which only release tags can use.
    environment: production
    env:
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Check the tag
        run: |
          if [[ "$REF_TYPE" != tag || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only release tags (vX.Y.Z) are deployed; got ${REF_TYPE} '${TAG}'."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${TAG} points to a commit that is not on main."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The key's forced command on the VPS (remote-deploy.sh) only accepts the tag name.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 "inbox@${DEPLOY_HOST}" "$TAG"

      - name: Check /up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "https://${DEPLOY_HOST}/up"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
