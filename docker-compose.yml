services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - inbox_network

  web:
    image: nginx:alpine
    container_name: inbox_web
    restart: unless-stopped
    ports:
      # Loopback only: the app and Inertia DevTools must not be reachable from the LAN
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inbox_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --queue=default,sync --sleep=3 --tries=3 --timeout=1500
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - inbox_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - inbox_network

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      # Loopback only: the Vite dev server must not be reachable from the LAN
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www/html
      # Linux-native node_modules (rolldown/lightningcss binaries differ from the host's)
      - vite_node_modules:/var/www/html/node_modules
    depends_on:
      - app
    networks:
      - inbox_network

volumes:
  vite_node_modules:

networks:
  inbox_network:
    driver: bridge
