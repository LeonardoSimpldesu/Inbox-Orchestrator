services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - inbox_network

  web:
    image: nginx:alpine
    container_name: inbox_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inbox_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - inbox_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - inbox_network

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inbox_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - inbox_network

networks:
  inbox_network:
    driver: bridge
